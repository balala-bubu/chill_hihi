<!doctype html><meta charset="utf-8">
<style>body{font:13px system-ui;width:250px;margin:12px;color:#222}label{display:flex;justify-content:space-between;align-items:center;margin:9px 0}select,input[type=text]{font:inherit}input[type=text]{width:100%;box-sizing:border-box}button{font:inherit;margin-top:6px;width:100%}small{color:#777}</style>
<label><b>懸浮播放器</b><input type="checkbox" id="enabled"></label>
<label>狗狗趴在上面<input type="checkbox" id="dog"></label>
<label>大小<select id="size"><option value="s">小</option><option value="m">中</option><option value="l">大</option></select></label>
<label>效能<select id="quality"><option value="eco">省電</option><option value="balanced">平衡</option><option value="smooth">流暢</option></select></label>
<button id="reset">重設位置（右下角）</button>
<hr><small>播放器網址</small><input type="text" id="url">
<script src="popup.js"></script>
