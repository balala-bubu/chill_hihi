<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BALA-1 Disc Player</title>
<script>/* desktop pet (?pet=full|mini): set the page classes before the first paint, so a transparent window never flashes the grey background */
if(/[?&]ext=1/.test(location.search))addEventListener('message',function(e){if(e.data&&e.data.chp==='port'&&e.ports&&e.ports[0])window.__chpPort=e.ports[0];});
(function(){var m=(location.search.match(/[?&]pet=(full|mini)/)||[])[1];if(m){var c=document.documentElement.classList;c.add('pet','pet-'+m);if(/[?&]card=1/.test(location.search))c.add('pet-card');if(/[?&]embed=1/.test(location.search))c.add('pet-embed');if(/[?&]ext=1/.test(location.search))c.add('pet-ext');if(window.petBridge)c.add('pet-app');}})();</script>
<style>
/* Layout: one full-bleed 3D stage. Frosted grey world, a single player, albums on a shelf above. */
:root{--bg:#d9dbde;--ink:#2d3033;--mute:#6a7076;--glass:rgba(240,241,243,.72);--line:rgba(45,48,51,.2)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
#stage{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage canvas{display:block;width:100%;height:100%;outline:none}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 88% 72% at 50% 50%,rgba(255,255,255,0) 58%,rgba(70,78,90,.12) 100%)}
#err[hidden]{display:none}
/* tools: the "⋯" button is one more slot at the end of the album row, standing on the shelf: its position is projected from the next free album slot every frame, so it scrolls with the albums */
#tools{position:fixed;left:0;top:0;width:46px;height:46px;z-index:8;transition:opacity .2s;font:500 12px/1.5 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
/* add form + edit panel: right-aligned under the plank (they are too wide to hang off a button that can sit anywhere along the row) */
#pop{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:0;z-index:7;display:flex;flex-direction:column;align-items:flex-end;gap:12px;transition:opacity .2s;font:500 12px/1.5 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
#tools.away,#pop.away{opacity:0;pointer-events:none;visibility:hidden}
#addMsg{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:6;max-width:min(88vw,460px);padding:8px 16px;border-radius:18px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);text-align:center;color:var(--ink);text-wrap:balance;pointer-events:none}
#addMsg:empty{display:none}
#addForm{display:flex;gap:8px;width:min(calc(100vw - 104px),400px);min-width:0}
#addForm[hidden]{display:none}
#addUrl{flex:1;min-width:0;height:42px;padding:0 14px;border-radius:21px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--ink);font:inherit;font-size:13px}
#addUrl::placeholder{color:var(--mute)}
#addGo{height:42px;padding:0 18px;border-radius:21px;font:inherit;font-weight:700}
#editPanel button:focus-visible,#menu button:focus-visible,#moreBtn:focus-visible,#editPanel input:focus-visible{outline:2px solid #ee5a2c;outline-offset:2px}
#editPanel{box-sizing:border-box;width:min(calc(100vw - 32px),380px);max-height:min(calc(100vh - 230px),420px);overflow:auto;padding:14px;border-radius:20px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);font:500 12px/1.5 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
#editPanel[hidden]{display:none}
#editPanel h2{margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.08em}
#editList{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:8px}
#editList li{display:flex;align-items:center;gap:8px;min-width:0}
#editList input{flex:1;min-width:0;height:36px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.55);color:var(--ink);font:inherit;font-size:13px}
#editList .cnt{color:var(--mute);white-space:nowrap}
#editList .del{width:32px;height:32px;border-radius:50%;padding:0;font:inherit;font-size:16px;line-height:1;--lift:3px;flex:none}
#editEmpty{color:var(--mute);margin:0 0 12px}
#editEmpty[hidden]{display:none}
#resetBtn{height:36px;padding:0 16px;border-radius:18px;font:inherit;font-weight:700;--lift:3px}
#resetBtn.sure{background:linear-gradient(180deg,#ff8658,#ee5a2c 60%,#dc4a1d);--foot:#a8330f;color:#fff}
#addUrl:focus-visible,#addGo:focus-visible{outline:2px solid #ee5a2c;outline-offset:2px}
/* raised, tactile buttons: a lit top face sits on a darker "foot"; pressing sinks the face into the foot */
.k3{--face:#f3f4f6;--foot:#aeb3b9;--lift:4px;position:relative;border:1px solid rgba(255,255,255,.85);background:linear-gradient(180deg,#fbfbfc 0%,var(--face) 55%,#e4e6e9 100%);color:var(--ink);cursor:pointer;
  box-shadow:0 var(--lift) 0 var(--foot),0 calc(var(--lift) + 5px) 12px rgba(45,48,51,.28),inset 0 1px 0 #fff,inset 0 -2px 3px rgba(45,48,51,.08);
  transform:translateY(0);transition:transform .09s ease-out,box-shadow .09s ease-out,background .2s;-webkit-tap-highlight-color:transparent}
.k3:hover{background:linear-gradient(180deg,#fff 0%,#f7f8f9 55%,#e9ebee 100%)}
.k3:active,.k3.on{transform:translateY(calc(var(--lift) - 1px));box-shadow:0 1px 0 var(--foot),0 3px 5px rgba(45,48,51,.25),inset 0 2px 5px rgba(45,48,51,.22);background:linear-gradient(180deg,#e3e5e8,#eceef0)}
.k3.dark{--face:#3a3e42;--foot:#14171a;border-color:rgba(255,255,255,.12);background:linear-gradient(180deg,#4a4f54 0%,#2d3033 60%,#25282b 100%);color:#f1f2f3}
.k3.dark:active{background:linear-gradient(180deg,#26292c,#2d3033)}
.k3.hot{--foot:#a8330f;border-color:rgba(255,200,180,.6);background:linear-gradient(180deg,#ff8658,#ee5a2c 60%,#dc4a1d);color:#fff}
.k3:disabled{opacity:.5;cursor:default;transform:none}
#moreBtn{width:46px;height:46px;border-radius:50%;padding:0;flex:none}
#moreBtn i{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:currentColor;transition:transform .25s cubic-bezier(.2,.9,.3,1.3),opacity .05s}
#moreBtn i:nth-child(1){transform:translateX(-9px)}#moreBtn i:nth-child(3){transform:translateX(9px)}
#moreBtn[aria-expanded="true"]{--lift:1px;transform:translateY(3px);background:linear-gradient(180deg,#26292c,#2d3033);color:#f1f2f3}
/* open: the three dots slide into the middle and become ONE dot (the outer two vanish once they have landed exactly on it) */
#moreBtn[aria-expanded="true"] i:nth-child(1),#moreBtn[aria-expanded="true"] i:nth-child(3){transform:translateX(0);opacity:0;transition:transform .25s cubic-bezier(.4,0,.2,1),opacity .01s .24s}
#moreBtn[aria-expanded="true"] i:nth-child(2){transform:scale(1.35)}
#tools.flip #menu{left:auto;right:0;transform-origin:calc(100% - 23px) 0}   /* near the screen's right edge the menu opens leftwards */
#menu{position:absolute;left:0;top:calc(46px + 12px);z-index:2;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:22px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transform-origin:23px 0;transition:opacity .18s,transform .22s cubic-bezier(.2,.9,.3,1.25);font:600 13px/1 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
#menu[hidden]{display:flex;opacity:0;transform:scale(.8) translateY(-8px);pointer-events:none;visibility:hidden}
#menu button{height:40px;min-width:150px;padding:0 18px 0 14px;border-radius:20px;display:flex;align-items:center;gap:10px;font:inherit;--lift:3px}
#menu button b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(45,48,51,.1);font-size:14px;line-height:1}
#menu button.danger b{background:rgba(238,90,44,.18);color:#c9411a}
#addGo{--lift:3px}
.ord{width:30px;height:30px;border-radius:10px;padding:0;font:inherit;font-size:11px;--lift:3px;flex:none}
.ord:disabled{opacity:.35}
#editList li.ro input{background:transparent;border-color:transparent;color:var(--mute)}
#shelfHint{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:5;height:26px;padding:0 14px;border-radius:13px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 2px 0 rgba(45,48,51,.18);font:500 11px/24px "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;color:var(--mute);cursor:pointer;transition:opacity .35s,transform .35s}
#shelfHint.gone{opacity:0;pointer-events:none;transform:translate(-50%,-10px)}
#shelfHint:focus-visible{outline:2px solid #ee5a2c;outline-offset:2px}
/* dog wardrobe: a pill on the right edge for touch screens, and a name tag while hovering an item */
#wardHint{position:fixed;right:calc(8px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:5;padding:12px 6px;border-radius:13px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 2px 0 rgba(45,48,51,.18);font:500 11px/1.2 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;color:var(--mute);cursor:pointer;writing-mode:vertical-rl;transition:opacity .35s,transform .35s}
#wardHint.gone{opacity:0;pointer-events:none;transform:translate(10px,-50%)}
#wardHint:focus-visible{outline:2px solid #ee5a2c;outline-offset:2px}
#wardRecycle{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:max(22px,env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-direction:column;gap:7px;max-width:min(190px,42vw);padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font:600 12px/1.3 "JetBrains Mono",ui-monospace,"PingFang TC",sans-serif;color:var(--ink)}
#wardRecycle[hidden]{display:none}
#wardRecycle .wardRecycleTitle{font-size:11px;color:var(--mute);letter-spacing:.05em;margin-bottom:2px}
#wardRecycle button{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px;padding:6px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.55);color:var(--ink);font:inherit;cursor:pointer;transition:background .15s}
#wardRecycle .t{color:var(--mute);font-weight:500;font-size:11px;letter-spacing:.06em;transition:color .15s}
#wardRecycle button:hover .t,#wardRecycle button:focus-visible .t{color:#ee5a2c}
#wardRecycle button:hover,#wardRecycle button:focus-visible{background:rgba(238,90,44,.13);outline-color:#ee5a2c}
#wardTip{position:fixed;left:0;top:0;z-index:6;padding:3px 11px;border-radius:12px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink);font:500 11px/1.5 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap}
#wardTip.on{opacity:1}
/* toy picked from the cabinet's bottom row: a small chip at the bottom centre says what a click on empty space will do */
#toyChip{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--ink);font:600 12px/1.3 "JetBrains Mono",ui-monospace,"PingFang TC",sans-serif;letter-spacing:.05em;cursor:pointer}
#toyChip[hidden]{display:none}
#toyChip .x{color:var(--mute);font-weight:500;transition:color .15s}
#toyChip:hover .x,#toyChip:focus-visible .x{color:#ee5a2c}
#toyChip:focus-visible{outline:2px solid #ee5a2c;outline-offset:2px}
#ytbox{position:fixed;left:0;top:0;width:640px;height:512px;opacity:0;pointer-events:none;z-index:4;overflow:hidden;transform-origin:0 0;border-radius:12px;background:#000;filter:contrast(1.12) saturate(.82) brightness(.95)}
#ytbox iframe,#ytbox #ytp{position:absolute;left:-135px;top:0;width:910px;height:512px;border:0}
#err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;font:14px/1.6 "JetBrains Mono",ui-monospace,monospace;color:var(--ink);text-align:center;background:var(--bg)}
/* ---- desktop pet (?pet=full | ?pet=mini): transparent page, a drag grip, and in mini a small control bar ---- */
html.pet:not(.pet-card),html.pet:not(.pet-card) body{background:transparent}
html.pet:not(.pet-card) #stage::after,html.pet #shelfHint.gone,html.pet #wardHint,html.pet #wardRecycle,html.pet #toyChip{display:none}
html.pet:not(.pet-card) #shelfHint{left:auto;right:12px;transform:none;opacity:.55;transition:opacity .2s,transform .35s}html.pet:not(.pet-card) #shelfHint:hover{opacity:1}
html.pet:not(.pet-card) #shelfHint.gone{transform:translateY(-10px)}   /* top-right corner: out of the dog's way */
html.pet:not(.pet-card) #err{background:transparent}
/* card style: the original grey-white scene inside a rounded player-like frame (the window itself is transparent, so the corners show the desktop) */
html.pet-card,html.pet-card body{background:transparent}   /* the card colour comes from the stage, so the rounded clip below really cuts the corners */
html.pet-card #stage,html.pet-card #err{background:var(--bg)}
html.pet-card{clip-path:inset(0 round 26px)}
html.pet-card body::after{content:"";position:fixed;inset:0;z-index:20;border-radius:26px;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),inset 0 0 0 2px rgba(45,48,51,.1),inset 0 6px 14px rgba(255,255,255,.35)}
#petGrip,#petHide,#petBar{display:none}
html.pet-app #petGrip,html.pet-app #petHide{display:grid;position:fixed;top:8px;z-index:9;height:22px;place-items:center;border-radius:11px;border:1px solid var(--line);background:var(--glass);color:var(--mute);font:600 12px/1 "JetBrains Mono",ui-monospace,Menlo,monospace;opacity:.4;transition:opacity .2s;-webkit-user-select:none;user-select:none}
html.pet-app #petGrip{left:8px;width:44px;cursor:grab;-webkit-app-region:drag}
html.pet-app #petHide{left:58px;width:26px;padding:0;cursor:pointer;-webkit-app-region:no-drag}
html.pet-app #petGrip:hover,html.pet-app #petHide:hover,html.pet-app #petHide:focus-visible{opacity:1}
html.pet-mini #shelfHint,html.pet-mini #wardHint,html.pet-mini #wardRecycle,html.pet-mini #wardPages,html.pet-mini #wardTip,html.pet-mini #tools,html.pet-mini #pop{display:none!important}
html.pet-mini #petBar{display:block;position:fixed;left:10px;right:10px;bottom:10px;z-index:9;font:500 12px/1.4 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
#petRow{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-radius:24px;border:1px solid var(--line);background:rgba(240,241,243,.92);box-shadow:0 4px 14px rgba(45,48,51,.18)}
#petNow{flex:1;min-width:0;display:flex;flex-direction:column}
#petNow b{font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#petNow small{font-size:10px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#petBtns{display:flex;gap:5px;flex:none}
#petBtns button{width:32px;height:32px;border-radius:50%;padding:0;font:inherit;font-size:13px;--lift:3px}
#petBtns button:focus-visible,#petAlbums button:focus-visible,#petAddUrl:focus-visible,#petAddForm button:focus-visible,#petHide:focus-visible{outline:2px solid #ee5a2c;outline-offset:2px}
#petList{position:absolute;left:0;right:0;bottom:calc(100% + 8px);max-height:min(58vh,210px);overflow:auto;padding:10px;border-radius:18px;border:1px solid var(--line);background:rgba(240,241,243,.96);box-shadow:0 4px 14px rgba(45,48,51,.18)}
#petList[hidden]{display:none}
#petAlbums{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:6px}
#petAlbums button{width:100%;min-height:38px;padding:5px 12px;border-radius:12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;font:inherit;text-align:left;--lift:2px}
#petAlbums button span{font-weight:700;font-size:12px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#petAlbums button small{font-size:10px;color:var(--mute)}
#petAddForm{display:flex;gap:6px}
#petAddUrl{flex:1;min-width:0;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--ink);font:inherit;font-size:12px}
#petAddForm button{height:34px;padding:0 14px;border-radius:17px;font:inherit;font-weight:700;--lift:3px}
/* compact upright window: smaller hint pill, the drag grip sits under the player */
html.pet #shelfHint{top:6px;height:20px;padding:0 9px;font-size:10px;line-height:18px}
html.pet-full.pet-app #petGrip,html.pet-full.pet-app #petHide{top:auto;bottom:8px}
/* small browser window (picture-in-picture or popup): a plain rectangle, so no rounded clip; a button for the dog */
html.pet-embed{clip-path:none!important}html.pet-embed{overflow:hidden}html.pet-embed body::after{display:none}
#petDogBtn{display:none}
html.pet-ext #shelfHint,html.pet-ext #petDogBtn{display:none!important}   /* floating player: no album shelf, no dog */
html.pet-embed #petDogBtn{display:grid;position:fixed;left:8px;bottom:8px;z-index:9;width:26px;height:26px;padding:0;place-items:center;border-radius:50%;font-size:14px;line-height:1;opacity:.55;--lift:2px}
html.pet-embed #petDogBtn:hover,html.pet-embed #petDogBtn[aria-pressed="true"]{opacity:1}
/* while nothing needs the picture, YouTube plays in a small player so it picks a low-resolution stream (set from petFrame) */
#ytbox.lite #ytp,#ytbox.lite iframe{left:0;width:320px;height:180px}
/* pixel clock: stuck to the bottom-left of the screen, above everything. Same recipe as the player: frosted matte body (soft top-to-bottom falloff, lit rim top/left, shaded rim bottom/right, fine grain), glossy orange key, dark OLED behind a glass pane (scanlines, pixel columns, diagonal glare) */
#clockW{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:12;width:178px;padding:12px 13px 14px;border-radius:32px;border:1px solid rgba(255,255,255,.85);background:linear-gradient(180deg,#f4f5f6 0%,#e7e9eb 45%,#d8dbde 100%);box-shadow:inset 2px 2px 0 rgba(255,255,255,.8),inset -2px -3px 0 rgba(60,66,76,.2),0 5px 0 #aeb3b9,0 18px 26px rgba(45,48,51,.3);font:600 11px/1 "JetBrains Mono",ui-monospace,"PingFang TC",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:manipulation;transform-origin:0 100%;transition:opacity .22s,transform .38s cubic-bezier(.2,.9,.3,1.25),visibility 0s .38s}
#clockW::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.55;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.6' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .25  0 0 0 0 .27  0 0 0 0 .3  0 0 0 .2 0'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}
#clockW:not(.on){opacity:0;visibility:hidden;pointer-events:none;transform:translate(-26px,26px) scale(.55)}
#clockW.on{transition:opacity .22s,transform .38s cubic-bezier(.2,.9,.3,1.25)}
/* the keys feel like the player's: they drop the instant you press and spring back past rest (same overshoot as the 3D keys), the face flashes, the body dips a hair */
#clockW .k3{transition:transform .34s cubic-bezier(.34,1.8,.5,1),box-shadow .34s cubic-bezier(.34,1.8,.5,1),background .2s}
#clockW .k3:active{transition:transform .035s ease-out,box-shadow .035s ease-out}
#clockW .k3:hover{transform:translateY(-1px)}
#clockW .k3:active,#clockW .k3.on{transform:translateY(calc(var(--lift) - 1px))}
#ckGo{flex:1;height:34px!important;border-radius:12px!important;--lift:5px;--foot:#9d2c0c}
#ckGo svg{display:block;margin:auto;width:18px;height:18px;fill:#fff;filter:drop-shadow(0 1px 0 rgba(120,30,5,.45))}
#ckGo.run{box-shadow:0 var(--lift) 0 var(--foot),0 calc(var(--lift) + 5px) 12px rgba(45,48,51,.28),inset 0 1px 0 rgba(255,255,255,.7),0 0 16px 3px rgba(255,120,70,.6)}
#ckGo:active{box-shadow:0 1px 0 var(--foot),0 3px 5px rgba(45,48,51,.3),inset 0 2px 5px rgba(120,30,5,.4)}
#clockW.on.press{transform:translateY(2px);transition:transform .035s ease-out}
#ckFace{transition:filter .35s ease-out}#ckFace.hit{filter:brightness(1.45);transition:filter .03s}
#ckTop{display:flex;align-items:center;gap:6px;margin-bottom:11px}
/* mode switch: a recessed track with a liquid-glass thumb. The thumb slides with an overshoot, stretches like a droplet on the way (ckGoo), swells while pressed, and bends the labels under it (SVG displacement as a progressive enhancement: Chromium only, the plain blur is the fallback) */
#ckSeg{position:relative;display:flex;flex:1;height:28px;padding:3px;border-radius:14px;background:linear-gradient(180deg,rgba(60,66,76,.2),rgba(60,66,76,.1));box-shadow:inset 0 2px 4px rgba(45,48,51,.3),0 1px 0 rgba(255,255,255,.85)}

/* ---------- helpers ---------- */
function mkTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;t.anisotropy=8;t.userData.c=c;return t;}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rrShape(w,h,r){const s=new T.Shape(),x=-w/2,y=-h/2;s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s;}
function rrBox(w,h,d,r,b){b=b||.04;const g=new T.ExtrudeGeometry(rrShape(w-2*b,h-2*b,Math.max(r-b,.01)),{depth:d-2*b,bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:3,curveSegments:10});g.translate(0,0,-(d-2*b)/2);return g;}
function flower(x,px,py,r,pc,cc){x.fillStyle=pc;for(let i=0;i<5;i++){const a=i/5*TAU;x.beginPath();x.arc(px+Math.cos(a)*r,py+Math.sin(a)*r,r*.62,0,TAU);x.fill();}x.fillStyle=cc;x.beginPath();x.arc(px,py,r*.5,0,TAU);x.fill();}

/* tileable 2-octave value noise used as roughness + bump map (frosted plastic grain) */
function grainTex(size,seed,rep){
  const R=rng(seed),d=new Uint8Array(size*size*4);
  const layer=cells=>{const g=[];for(let i=0;i<cells*cells;i++)g.push(R());
    return (x,y)=>{const fx=x/size*cells,fy=y/size*cells,x0=Math.floor(fx),y0=Math.floor(fy),tx=fx-x0,ty=fy-y0,u=tx*tx*(3-2*tx),v=ty*ty*(3-2*ty),
      a=g[(y0%cells)*cells+x0%cells],b=g[(y0%cells)*cells+(x0+1)%cells],c=g[((y0+1)%cells)*cells+x0%cells],e=g[((y0+1)%cells)*cells+(x0+1)%cells];
      return lerp(lerp(a,b,u),lerp(c,e,u),v);};};
  const n1=layer(6),n2=layer(24);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){const v=.55*n1(x,y)+.3*n2(x,y)+.15*R(),o=(y*size+x)*4,q=Math.round(150+v*105);d[o]=d[o+1]=d[o+2]=q;d[o+3]=255;}
  const t=new T.DataTexture(d,size,size,T.RGBAFormat);t.wrapS=t.wrapT=T.RepeatWrapping;t.magFilter=T.LinearFilter;t.minFilter=T.LinearMipmapLinearFilter;
  t.generateMipmaps=true;t.anisotropy=4;t.repeat.set(rep,rep);t.needsUpdate=true;return t;
}
function weaveTex(rep){const t=mkTex(64,64,(x,w)=>{x.fillStyle='#777';x.fillRect(0,0,w,w);for(let j=0;j<8;j++)for(let i=0;i<8;i++){x.fillStyle=(i+j)%2?'#c8c8c8':'#5a5a5a';x.fillRect(i*8+1,j*8+1,6,6);}});
  t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rep,rep);return t;}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}};

const hashStr=t=>{let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;};
function ytAlbum(o,cov){
  const h=hashStr(o.list),hue=h%360;let c;
  if(cov){const [r,g,b]=cov.avg.map(Math.round);c=['rgb('+r+','+g+','+b+')','#f3f1ec','#ee5a2c','#f4b942'];}
  else c=['hsl('+hue+',45%,24%)','hsl('+(hue+25)+',40%,72%)','hsl('+(hue+160)+',70%,56%)','hsl('+(hue+45)+',85%,66%)'];
  return {t:o.title||'PLAYLIST',a:(o.author||'YOUTUBE').toUpperCase(),m:['orbit','tiles','sun','wave','grid','stripe'][h%6],seed:h%997+1,c,img:cov?cov.im:null,yt:{list:o.list,ids:o.ids},bpm:80,root:55,lead:'triangle',prog:[]};

function art(x,S,alb,txt){
  const R=rng(alb.seed),c=alb.c;
  const g=x.createLinearGradient(0,0,0,S);g.addColorStop(0,c[0]);g.addColorStop(1,c[1]);x.fillStyle=g;x.fillRect(0,0,S,S);
  const blob=(px,py,rad,col,al)=>{const r=x.createRadialGradient(px,py,0,px,py,rad);r.addColorStop(0,col);r.addColorStop(1,'rgba(255,255,255,0)');x.globalAlpha=al;x.fillStyle=r;x.beginPath();x.arc(px,py,rad,0,TAU);x.fill();x.globalAlpha=1;};
  if(alb.img){const im=alb.img,s=Math.min(im.naturalWidth,im.naturalHeight);x.drawImage(im,(im.naturalWidth-s)/2,(im.naturalHeight-s)/2,s,s,0,0,S,S);}
  else switch(alb.m){
   case 'sky':
    for(let i=0;i<8;i++)blob(R()*S,S*(.08+R()*.5),S*(.16+R()*.2),'#ffffff',.85);
    x.fillStyle='#8fb86a';x.beginPath();x.ellipse(S*.5,S*1.05,S*.78,S*.3,0,0,TAU);x.fill();
    for(let i=0;i<16;i++)flower(x,R()*S,S*(.7+R()*.24),S*(.025+R()*.03),i%3?c[3]:'#ffffff',c[2]);
    break;
   case 'orbit':
    x.strokeStyle=c[1];for(let i=1;i<=7;i++){x.lineWidth=S*(.004+R()*.006);x.beginPath();x.arc(S*.5,S*.5,S*i*.065,0,TAU);x.stroke();}
    x.fillStyle=c[2];x.beginPath();x.arc(S*.76,S*.32,S*.07,0,TAU);x.fill();
    x.fillStyle=c[3];x.beginPath();x.arc(S*.5,S*.5,S*.1,0,TAU);x.fill();break;
   case 'tiles':{const s=S/4;
    for(let j=0;j<4;j++)for(let i=0;i<4;i++){x.save();x.beginPath();x.rect(i*s,j*s,s,s);x.clip();
      x.fillStyle=c[(R()*4)|0];x.fillRect(i*s,j*s,s,s);x.fillStyle=c[(R()*4)|0];
      const q=(R()*4)|0,cx=i*s+(q%2?s:0),cy=j*s+(q>1?s:0);x.beginPath();x.arc(cx,cy,s*.92,0,TAU);x.fill();x.restore();}
    break;}
   case 'sun':
    x.fillStyle=c[2];x.beginPath();x.arc(S*.5,S*.62,S*.3,0,TAU);x.fill();
    x.fillStyle=c[3];x.beginPath();x.arc(S*.5,S*.62,S*.17,0,TAU);x.fill();
    x.fillStyle=c[0];for(let i=0;i<6;i++)x.fillRect(0,S*(.5+i*.035),S,S*(.004+i*.004));
    x.fillRect(0,S*.7,S,S*.3);x.fillStyle=c[2];x.globalAlpha=.35;for(let i=0;i<5;i++)x.fillRect(S*(.5-.24+i*.03),S*(.73+i*.04),S*(.48-i*.06),S*.012);x.globalAlpha=1;break;
   case 'wave':
    for(let i=0;i<7;i++){x.fillStyle=[c[1],c[2],c[3],c[0]][i%4];x.beginPath();x.moveTo(0,S);for(let px=0;px<=S;px+=8)x.lineTo(px,S*(.18+i*.11)+Math.sin(px/S*TAU*(1+i*.25)+i)*S*.05);x.lineTo(S,S);x.closePath();x.fill();}
    break;
   case 'grid':
    for(let j=0;j<12;j++)for(let i=0;i<12;i++){const d=Math.hypot(i-5.5,j-5.5)/7.8;x.fillStyle=d<.55?c[3]:c[1];x.beginPath();x.arc((i+.5)*S/12,(j+.5)*S/12,S*(.04*(1-d*.7)+.004),0,TAU);x.fill();}
    break;
   case 'stripe':
    x.save();x.translate(S/2,S/2);x.rotate(-.5);for(let i=-10;i<=10;i++){x.fillStyle=i%2?c[1]:c[0];x.fillRect(-S,i*S*.09,S*2,S*.05);}x.restore();
    x.fillStyle=c[2];x.beginPath();x.arc(S*.5,S*.46,S*.2,0,TAU);x.fill();x.fillStyle=c[3];x.beginPath();x.arc(S*.57,S*.4,S*.07,0,TAU);x.fill();break;
  }
  x.globalAlpha=alb.img?0:.07;for(let i=0;i<1800;i++){x.fillStyle=R()>.5?'#fff':'#000';x.fillRect(R()*S,R()*S,2,2);}x.globalAlpha=1;
  if(txt){ /* full-bleed cover: artwork runs edge to edge, title sits on a soft shade instead of an opaque bar */
    const gg=x.createLinearGradient(0,S*.8,0,S);gg.addColorStop(0,'rgba(0,0,0,0)');gg.addColorStop(1,'rgba(0,0,0,.4)');x.fillStyle=gg;x.fillRect(0,S*.8,S,S*.2);
    x.save();x.shadowColor='rgba(0,0,0,.4)';x.shadowBlur=S*.012;x.fillStyle='#f6f4ee';x.textBaseline='middle';
    x.font='700 '+(S*.05)+'px '+MONO;x.textAlign='left';x.fillText(fitText(x,alb.t,S*.6),S*.05,S*.94);
    x.font='500 '+(S*.032)+'px '+MONO;x.textAlign='right';x.fillText(fitText(x,alb.a,S*.26),S*.95,S*.94);x.restore();}
}
const coverTex=a=>mkTex(512,512,(x,w)=>art(x,w,a,false));   // front = artwork only, the title and artist live on the spine
function spineTex(a){return mkTex(96,900,(x,w,h)=>{
  x.fillStyle='#ecebe6';x.fillRect(0,0,w,h);x.fillStyle=a.c[2];x.fillRect(0,0,w,70);x.fillStyle=a.c[0];x.fillRect(0,h-52,w,52);
  x.fillStyle='rgba(0,0,0,.07)';x.fillRect(0,0,3,h);x.fillRect(w-3,0,3,h);   // faint edge lines where the paper meets the case
  x.textBaseline='middle';x.textAlign='left';
  /* artist sits at the foot of the spine (right-aligned, lighter), the song/album title takes whatever length is left above it */
  x.font='500 32px '+MONO;const art_=fitText(x,a.a||'',250),aw=x.measureText(art_).width,aEnd=h-52-24;
  x.save();x.translate(w/2,aEnd-aw);x.rotate(Math.PI/2);x.fillStyle='#6a6f75';x.fillText(art_,0,0);x.restore();
  const tMax=Math.max(120,aEnd-aw-26-100);let fs=44;x.font='700 '+fs+'px '+MONO;while(x.measureText(a.t).width>tMax&&fs>22){fs-=2;x.font='700 '+fs+'px '+MONO;}
  x.save();x.translate(w/2,100);x.rotate(Math.PI/2);x.fillStyle='#24272a';x.fillText(fitText(x,a.t,tMax),0,0);x.restore();
  x.fillStyle=a.c[2];x.globalAlpha=.7;x.beginPath();x.arc(w/2,aEnd-aw-14,4,0,TAU);x.fill();x.globalAlpha=1;});}   // little dot between title and artist
const trayTex=()=>mkTex(512,512,(x,w)=>{   // black slim-case tray: soft sheen, a round recess for the disc, fine concentric moulding lines
  const c=w/2,g=x.createRadialGradient(c,c,0,c,c,w*.72);g.addColorStop(0,'#26282c');g.addColorStop(1,'#111214');x.fillStyle=g;x.fillRect(0,0,w,w);
  x.lineWidth=1.2;for(let r=50;r<236;r+=7){x.strokeStyle='rgba(255,255,255,'+(.025+.02*((r/7)%2))+')';x.beginPath();x.arc(c,c,r,0,TAU);x.stroke();}
  x.strokeStyle='#08090a';x.lineWidth=9;x.beginPath();x.arc(c,c,234,0,TAU);x.stroke();                       // recess wall
  x.strokeStyle='rgba(255,255,255,.16)';x.lineWidth=2.5;x.beginPath();x.arc(c,c,226,0,TAU);x.stroke();        // lit lip inside it
  x.strokeStyle='rgba(255,255,255,.06)';x.lineWidth=2;x.beginPath();x.arc(c,c,262,0,TAU);x.stroke();
  x.fillStyle='#0c0d0e';x.beginPath();x.arc(c,c,46,0,TAU);x.fill();x.strokeStyle='rgba(255,255,255,.12)';x.lineWidth=2;x.beginPath();x.arc(c,c,46,0,TAU);x.stroke();   // hub well
});
function cdTex(a){return mkTex(1024,1024,(x)=>{const S=1024;x.save();x.beginPath();x.arc(512,512,508,0,TAU);x.clip();art(x,S,a,false);
  const g=x.createRadialGradient(512,512,60,512,512,190);g.addColorStop(0,'#f2f4f6');g.addColorStop(.6,'#cdd2d7');g.addColorStop(1,'#e8ebee');x.fillStyle=g;x.beginPath();x.arc(512,512,190,0,TAU);x.fill();
  x.strokeStyle='rgba(60,64,70,.35)';x.lineWidth=3;x.beginPath();x.arc(512,512,190,0,TAU);x.stroke();x.restore();
  x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=6;x.beginPath();x.arc(512,512,505,0,TAU);x.stroke();});}

  let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(255,255,255,.2)');g.addColorStop(.4,'rgba(255,255,255,0)');g.addColorStop(.72,'rgba(70,78,90,0)');g.addColorStop(1,'rgba(70,78,90,.13)');x.fillStyle=g;x.fillRect(0,0,w,h);

      const n=c.committed?Math.min(10,Math.ceil(Math.hypot(mx,my)/.35)):1;
      for(let i=0;i<n;i++){c.pos.x+=mx/n;c.pos.y+=my/n;if(c.committed)collide(c,null,0);}
      c.vel.x=lerp(c.vel.x,(c.pos.x-px)/Math.max(dt,.001),.35);c.vel.y=lerp(c.vel.y,(c.pos.y-py)/Math.max(dt,.001),.35);
    }
    const tl=c.committed&&overBody(c.pos)?.2:1;   // keep the disc almost flat while it travels over the player so its rim never digs into it
    c.root.rotation.y+=(clamp(c.vel.x*.035,-.45,.45)*tl-c.root.rotation.y)*.2;c.root.rotation.x+=(clamp(-c.vel.y*.035,-.45,.45)*tl-c.root.rotation.x)*.2;
    c.spin*=Math.exp(-dt*2);
  }else if(m==='free'){
    /* released in mid-air: it falls to the floor (gravity), bounces a little and slides to a stop; thrown fast it still flies first */
    const onFloor=c.pos.y<=FLOOR_Y+CDR+.13;
    c.vel.x*=Math.exp(-dt*(onFloor?4.2:.7));c.vel.y-=CD_G*dt;c.vel.y*=Math.exp(-dt*.25);
    if(onFloor&&Math.abs(c.vel.y)<Math.max(1.6,CD_G*dt*2.2))c.vel.y=0;   // resting: no micro-bounce at any frame rate
    c.pos.z+=(cdLevel(c)-c.pos.z)*(1-Math.exp(-dt*10));
    const n=Math.min(10,Math.ceil(Math.hypot(c.vel.x,c.vel.y)*dt/.35)||1);
    for(let i=0;i<n;i++){c.pos.x+=c.vel.x*dt/n;c.pos.y+=c.vel.y*dt/n;collide(c,c.vel,.62);}
    c.spin*=Math.exp(-dt*1.1);c.root.rotation.x*=.85;c.root.rotation.y*=.85;
    /* it has come to rest on the floor: it shrinks and drops flat onto the ground plane (see 'floor') */
    if(c.pos.y<=FLOOR_Y+CDR+.13&&Math.abs(c.vel.y)<.5&&Math.abs(c.vel.x)<.9){c.mode='floor';c.vel.y=0;Au.click(.55,.7);}
  }else if(m==='floor'){
    /* lying on the floor: small and flat. it slides to a stop and settles onto the floor plane, a bit nearer the camera, in the lane the dog walks in */
    const hw=L.hw-.9;
    c.vel.x*=Math.exp(-dt*5);c.pos.x=clamp(c.pos.x+c.vel.x*dt,-hw,hw);
    const k=1-Math.exp(-dt*9);c.pos.y+=(FLOOR_Y+.02-c.pos.y)*k;c.pos.z+=(FLOOR_Z-c.pos.z)*k;
    c.spin*=Math.exp(-dt*2.5);c.root.rotation.x*=.8;c.root.rotation.y*=.8;
  }else if(m==='carried'){
    /* in the dog's mouth: the dog places it every frame (dogFrame) */
    c.spin*=Math.exp(-dt*2.5);c.root.rotation.x*=.8;c.root.rotation.y*=.8;
  }else if(m==='in'){
    c.pos.set(BAY.x,BAY.y,FZ+.07);c.root.rotation.set(0,0,0);
    const target=status==='playing'?9:0;c.spin+=(target-c.spin)*(1-Math.exp(-dt*2.2));
  }
  /* small + flat while it lies on the floor or hangs in the dog's mouth; any other mode (picked up, thrown, inserted) eases it back to its normal size and pose.
     the shrink and the tilt live on the disc and the sheen ring, so the position, the root scale and the tween code of the other modes are untouched */
  {const on=m==='floor'||m==='carried',kf=1-Math.exp(-dt*(on?10:16)),tt=m==='floor'?1:m==='carried'?.62:0;
   c.flat+=((on?1:0)-c.flat)*kf;c.tilt+=(tt-c.tilt)*kf;if(c.flat<.002&&!on)c.flat=0;if(c.tilt<.002&&!on)c.tilt=0;
   const sc=lerp(1,FLAT_S,c.flat);c.disc.scale.setScalar(sc);c.rb.scale.setScalar(sc);
   c.disc.rotation.x=c.rb.rotation.x=-c.tilt*Math.PI/2;c.mesh.scale.setScalar(1+.8*c.flat);c.rb.visible=c.flat<.3;}   // the hit disc grows with it so a small CD is still easy to click
  if(m!=='insert')c.disc.rotation.z+=c.spin*dt;
}

/* ---------- lid, player feedback ---------- */
/* a disc has just landed: fire the burst, kick the bay light, press the body down, dip the disc, nudge the camera */
function impact(c){

  tween(.3,k=>{pOff.jig=-Math.sin(Math.PI*k)*.08*(1-.35*k);},ease.lin);

}
function jiggle(){return tween(.2,k=>{pOff.jig=-Math.sin(Math.PI*k)*.035;},ease.lin);}
async function setLid(open,quiet){
  if(lidOpen===open)return;lidOpen=open;const from=lidPivot.rotation.y,to=open?LID_OPEN:0;
  if(!quiet)Au.click(.8,.9);
  await tween(open?.6:.5,k=>{lidPivot.rotation.y=lerp(from,to,k);},open?ease.out5:ease.io2);

function pressAnim(i){
  const g=keys[i],z0=g.userData.z0,tok=g.userData.tok=(g.userData.tok||0)+1;
  tween(.07,k=>{if(g.userData.tok===tok)g.position.z=lerp(g.position.z,z0-.17,k);g.rotation.x=lerp(g.rotation.x,.05,k);},ease.out3).then(()=>{
    if(g.userData.tok!==tok)return;const from=g.position.z;return tween(.3,k=>{if(g.userData.tok===tok)g.position.z=lerp(from,z0,k);g.rotation.x*=1-k;},ease.outBack);});

function press(i){
  pressAnim(i);Au.click(i>1?1.15:.9,1);keyGlow[i]=1;buzz(7);

    else if(status==='paused'){Au.resume();status='playing';}
    else if((status==='ready'||status==='stopped')&&cd){Au.start(ALBUMS[cd.ai]);status='playing';}
  }else if(i===1){

  }else{const v0=Au.vol;Au.setVol(clamp(Au.vol+(i===5?1:-1),0,10));volT=1.4;updateLeds();if(Au.vol!==v0)ledFlash[clamp(i===5?Au.vol-1:Au.vol,0,9)]=1;}
}

/* ---------- insert CD, close lid, plug in headphones ---------- */
async function insertCD(){
  const c=cd;busy=true;c.mode='insert';c.vel.set(0,0);camLock=true;
  const p0=c.pos.clone(),r0=c.disc.rotation.z;
  rig.td=L.d*.55;rig.ty=BAY.y*.9;rig.tx=0;
  await tween(.3,k=>{c.pos.set(lerp(p0.x,BAY.x,k),lerp(p0.y,BAY.y,k),lerp(p0.z,1.1,k));c.root.rotation.x*=.8;c.root.rotation.y*=.8;},ease.out3);
  Au.whoosh();
  await tween(.9,k=>{const h=Math.sin(Math.PI*k);c.pos.z=1.1+h*1.5;c.disc.rotation.z=r0+TAU*ease.io3(k);c.root.scale.setScalar(1+.12*h);},ease.lin);
  await tween(.26,k=>{c.pos.z=lerp(1.1,FZ+.07,ease.in2(k));c.root.scale.setScalar(1);},ease.lin);
  Au.thunk();Au.smash();impact(c);buzz([16,22,10]);cdIn=true;c.mode='in';c.spin=0;

async function plugIn(){   // after the disc is in: headphones are tossed in, the plug flies to the jack and snaps in (see seekPlug)
  if(!PHYS||hpState.s==='plugged'||hpState.s==='seek')return;
  rig.td=L.d;rig.tx=-1.7;rig.ty=-1.5;

async function ejectCD(){

/* ---------- input ---------- */
let pd=null,dragY0=0;
/* the pointer is inside the band the shelf occupies while it is out: there, a press scrolls the albums, it never grabs the player behind them */
function onShelf(){const g=planeHit(0);return !!(g&&g.y>L.shelfB-.2&&shelfVis>.6&&(state==='home'||state==='stage'));}
function grabCD(e){
  const c=cd;const fromIn=c.mode==='in';c.mz=false;
  c.dragFrom=fromIn?'stage':(state==='albumOpen'?'case':'stage');c.committed=c.dragFrom==='stage';
  if(fromIn){cdIn=false;status='empty';Au.stop();}
  c.zT=c.dragFrom==='case'?c.pos.z+.9:.58;c.mode='drag';c.vel.set(0,0);c.safeX=c.pos.x;c.safeY=c.pos.y;
  const h=planeHit(c.zT);if(h)c.off.set(c.pos.x-h.x,c.pos.y-h.y);dragY0=e.clientY;
  cvs.style.cursor='grabbing';
}
function releaseCD(){
  const c=cd;if(!c||c.mode!=='drag')return;
  if(!c.committed){c.mode='case';return;}
  const d=Math.hypot(c.pos.x-BAY.x,c.pos.y-BAY.y);
  if(lidOpen&&!cdIn&&d<1.8){insertCD();return;}
  if(cdAlbum>=0&&albums[cdAlbum].mag>.45){dockCD();return;}
  c.mode='free';c.spin=c.vel.x*.45;

cvs.addEventListener('pointerdown',e=>{
  Au.ensure();setNDC(e);const h=pick();
  pd={x:e.clientX,y:e.clientY,lx:e.clientX,moved:false,kind:'bg',album:-1};
  try{cvs.setPointerCapture(e.pointerId);}catch(_){}
  const o=h&&h.object;
  if(PHYS&&o&&o.userData.phys&&(o.userData.phys==='hp'||(state!=='album'&&state!=='albumOpen'&&state!=='opening'))){
    const wasWorn=o.userData.phys==='hp'&&hpState.worn;
    if(startPhysGrab(h)){pd.kind='phys';cvs.style.cursor='grabbing';if(wasWorn)e.stopPropagation();return;}
  }
  if(busy)return;
  if(o&&o.userData.cd){grabCD(e);pd.kind='cd';}
  else if(o&&o.userData.key!==undefined){pd.kind='key';press(o.userData.key);}
  else if(o&&o.userData.album!==undefined){
    pd.album=o.userData.album;
    if(state==='album'&&pd.album===sel)pd.kind='selTap';
    else if((state==='home'||state==='stage')&&shelfVis>.6)shelfGrab(e);
    else pd.kind='bg';
  }
  else if(o&&isPlayerObj(o)&&!onShelf()){pd.kind='player';const g0=planeHit(FZ);if(g0){pd.h0=g0.clone();pd.ux0=pDrag.tx;pd.uy0=pDrag.ty;}}
  else{const g=planeHit(0);if(g&&g.y>L.shelfB-.2&&shelfVis>.6&&(state==='home'||state==='stage'))shelfGrab(e);}
});
/* pressing the shelf: remember which slot coordinate is under the pointer and stop any glide, so a tap catches a moving shelf */
function shelfGrab(e){
  const w=shelfWorld(e.clientX,e.clientY);
  pd.kind='shelf';pd.cx=e.clientX;pd.cy=e.clientY;pd.u0=w?sx+slotD(w.x):sx;
  sxVel=0;sxTarget=clamp(Math.round(sx),0,N-1);wheelLive=false;shelfDrag=false;}
/* The shelf stays tucked away until the pointer visits the top edge of the screen (with hysteresis so it doesn't flicker). */
function trackTop(e){if(e.pointerType==='touch')return;const f=e.clientY/innerHeight;if(f<.13)topHover=true;else if(f>.3)topHover=false;}
cvs.addEventListener('pointerleave',()=>{hoverKey=-1;shPtr.ok=false;if(!pd)topHover=false;});
cvs.addEventListener('pointermove',e=>{
  setNDC(e);rig.ptx=ndc.x;rig.pty=ndc.y;trackTop(e);
  shPtr.x=e.clientX;shPtr.y=e.clientY;shPtr.ok=e.pointerType!=='touch';   // the shelf reads these once per frame (shelfStep)
  if(!shPtr.armed&&Math.hypot(e.clientX-shPtr.fx,e.clientY-shPtr.fy)>SH.centerMove)shPtr.armed=true;   // moved again since the last hover-centre: it may fire again
  if(pd&&pd.kind==='shelf'){pd.cx=e.clientX;pd.cy=e.clientY;}
  if(!pd){
    const h=pick(),o=h&&h.object;let cur='default';hoverKey=-1;
    if(o&&o.userData.phys)cur=o.userData.rbtn!==undefined?'pointer':'grab';else if(o&&!busy){if(o.userData.cd)cur='grab';else if(o.userData.key!==undefined){cur='pointer';hoverKey=o.userData.key;}else if(o.userData.album!==undefined)cur=(state==='home'||state==='album'?'pointer':'default');else if(isPlayerObj(o))cur='grab';}
    cvs.style.cursor=cur;smHover(o&&o.userData.rbtn!==undefined?o.userData.rbtn:-1);return;   // (10-world/03-summon-menu.js)
  }
  smHide();
  if(Math.hypot(e.clientX-pd.x,e.clientY-pd.y)>(pd.kind==='shelf'?(e.pointerType==='touch'?8:4):pd.kind==='phys'?8:6))pd.moved=true;
  if(pd.kind==='phys'){moveGrab(e);return;}
  /* shelf drag: just start it. the albums are moved in shelfStep, once per frame, from the latest pointer position */
  if(pd.kind==='shelf'&&pd.moved&&!shelfDrag){shelfDrag=true;cvs.style.cursor='grabbing';}
  pd.lx=e.clientX;
  /* drag the player around: pure translation (no tilt, no flip). The click that opens the lid only fires when the pointer didn't move. */
  if(pd.kind==='player'&&pd.moved&&pd.h0&&!busy&&(state==='home'||state==='stage')){
    const h=planeHit(FZ);
    if(h){pDrag.on=true;cvs.style.cursor='grabbing';
      const lim=L.hw-PW/2-.15,tvOn=tv.state==='falling'||tv.state==='on';
      pDrag.tx=clamp(pd.ux0+h.x-pd.h0.x,tvOn?0:-lim-pOff.x,lim-pOff.x);                 // with the TV out it can only go further right, away from the set
      pDrag.ty=clamp(pd.uy0+h.y-pd.h0.y,-.3,L.top-.2-PH/2-PY);}}                          // stays above the floor and on screen
  if(pd.kind==='cd'&&cd&&cd.mode==='drag'&&!cd.committed&&e.clientY-dragY0>innerHeight*.18)commitStage();
});
function closeTools(){setMenu(false);setPanel(null);setForm(false);}
function up(){
  if(!pd)return;const p=pd;pd=null;pDrag.on=false;
  if(p.kind==='bg'&&!p.moved)closeTools();   // tap on empty background: put the tools away (the shelf follows)
  if(p.kind==='phys'){endPhysGrab(p.moved);cvs.style.cursor='default';return;}
  if(p.kind==='cd'){releaseCD();}
  else if(p.kind==='shelf'){
    if(!p.moved&&p.album>=0)selectAlbum(p.album);
    else if(shelfDrag){
      /* let go: the spring keeps the speed the drag had and settles on the slot a flick would reach (sxVel has already decayed to ~0 if the pointer rested before release) */
      sxVel=clamp(sxVel,-SH.flickMax,SH.flickMax);
      sxTarget=clamp(Math.round(sx+clamp(sxVel*SH.flickLead,-1.6,1.6)),0,N-1);}
    shelfDrag=false;
  }
  else if(p.kind==='selTap'&&!p.moved)openAlbum();
  else if(p.kind==='player'&&!p.moved){if(!busy&&(state==='home'||state==='stage')){if(cdIn){if(lidOpen){setLid(false);if(lidResume&&status==='paused'){Au.resume();status='playing';}lidResume=false;}else{lidResume=status==='playing';if(lidResume){Au.pause();status='paused';}setLid(true);}}else setLid(!lidOpen);}}
  else if(p.kind==='bg'&&!p.moved&&!busy&&(state==='album'||state==='albumOpen'))cancelAlbum();
  else if(p.kind==='bg'&&!p.moved&&shelfPin&&(state==='home'||state==='stage'))shelfPin=false;
  cvs.style.cursor='default';
}
cvs.addEventListener('pointerup',up);cvs.addEventListener('pointercancel',up);
/* wheel / trackpad: continuous. the target follows every tick (about SH.wheelPx of travel = one album, the spring eases toward it), and once the wheel has been
   quiet for a moment shelfStep settles it on an album. trackpad inertia scrolls smoothly and ends on a slot instead of spinning past it or stepping in jerks */
cvs.addEventListener('wheel',e=>{if(state!=='home'&&state!=='stage')return;e.preventDefault();if(shelfVis<.6)return;
  const d0=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY,d=e.deltaMode===1?d0*16:e.deltaMode===2?d0*innerHeight:d0;
  if(!wheelLive){wheelLive=true;wheelFrom=sxTarget;}
  sxTarget=clamp(sxTarget+d/SH.wheelPx,-.35,N-.65);wheelT=performance.now();
},{passive:false});


/* ---------- YouTube playlist -> album ---------- */
const $id=i=>document.getElementById(i);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
function loadImg(src){return new Promise(res=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>res(im);im.onerror=()=>res(null);im.src=src;});}
function coverOf(im){   // cover image -> {im, avg colour}; null if it has no CORS headers (cannot be used as a texture)
  try{const c=document.createElement('canvas');c.width=c.height=8;const x=c.getContext('2d');x.drawImage(im,0,0,8,8);const d=x.getImageData(0,0,8,8).data;let r=0,g=0,b=0;
    for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];}const n=d.length/4;return {im,avg:[r/n,g/n,b/n]};}
  catch(e){return null;}
}
async function loadCoverUrl(u){const im=await loadImg(u);return im&&im.naturalWidth>50?coverOf(im):null;}

  for(const q of ['hq720','mqdefault']){
    const im=await loadImg('https://i.ytimg.com/vi/'+id+'/'+q+'.jpg');
    if(im&&im.naturalWidth>200)return coverOf(im);

let cbN=0;
function jsonp(url){return new Promise((res,rej)=>{const name='mtcb'+(++cbN)+'_'+(Math.random()*1e6|0),s=document.createElement('script');
  const t=setTimeout(()=>{done();rej(new Error('timeout'));},7000);

async function defCover(d){   // swap the generated cover for the real one, only while nothing is lifted off the shelf
  if(d.coverDone||d.coverBusy)return;d.coverBusy=true;
  try{
    let cov=d.coverUrl?await loadCoverUrl(d.coverUrl):null;   // DEFAULT_LISTS img first, then the first track's thumbnail
    if(!cov&&d.yt.ids.length)cov=await loadCover(d.yt.ids[0]);
    if(!cov)return;
    while(ALBUMS.indexOf(d)>=0&&!(state==='home'&&!cd&&!busy&&sel<0&&!shelfDrag))await sleep(600);
    const i=ALBUMS.indexOf(d);if(i<0)return;
    Object.assign(d,ytAlbum({list:d.yt.list,ids:d.yt.ids,title:d.t,author:d.a},cov));rebuildAt(i);d.coverDone=true;
  }finally{d.coverBusy=false;}
}
async function defLoad(d){
  if(!d.yt.ids.length){
    for(let k=0;k<3&&!d.yt.ids.length;k++){
      while(!defIdle())await sleep(500);

      catch(e){console.warn('default list',d.t,e&&e.message);if(YTA.failed)return;await sleep(4000);}
    }

}

/* ---------- bluetooth headphones ---------- */
/* The headphones are not always there. They swoop in and plug into the jack when Bluetooth headphones are connected, and when they go away the plug
   pops out and the headphones reel themselves up off the top of the screen. With nothing connected a disc just plays.
   A web page cannot ask "is Bluetooth connected": it can only list the audio outputs, and only sees their names once the page has permission.
   So there are two ways in, and they work together:
   - the remote's headphone key (the BT key) brings the headphones out / sends them away by hand. The first time (Chrome), it opens the browser's
     "choose an output device" picker: pick the AirPods once and the page can read their name and remember them;
   - after that, the output list changing (connecting / disconnecting) does it automatically. Without names it can only count outputs
     (one more than the fewest ever seen counts as connected, so a wired headset triggers it too). */
let btOn=false,btHave=false,btBusy=false,btBase=null,btAuto=false,btForce=null,btLabeled=false,btPick=null;
try{btPick=JSON.parse(localStorage.getItem('chill_bt_pick')||'null');}catch(_){}
const BT_RE=/bluetooth|airpods|buds|earbud|earphone|headphone|headset|hands-?free|beats|wh-\d|wf-\d|藍牙|藍芽|耳機|耳麥/i;
async function btScan(){
  const md=navigator.mediaDevices;if(!md||!md.enumerateDevices)return;
  let list;try{list=await md.enumerateDevices();}catch(_){return;}
  const out=list.filter(d=>d.kind==='audiooutput'&&d.deviceId!=='default'&&d.deviceId!=='communications');
  btLabeled=out.some(d=>d.label);
  if(btLabeled)btAuto=out.some(d=>BT_RE.test(d.label)||(btPick&&d.deviceId===btPick.id));
  else{btBase=btBase===null?out.length:Math.min(btBase,out.length);btAuto=out.length>btBase;}
  btApply();
}
function btApply(){btSet(btForce===null?btAuto:btForce);}
function btSet(on){on=!!on;remLit(2,on);if(on===btOn)return;btOn=on;btSync();}   // also the test hook: __mt.btSet(true/false)
async function btButton(){   // the remote's headphone key
  if(btOn){btForce=false;btApply();return;}
  const md=navigator.mediaDevices;
  if(md&&md.selectAudioOutput&&!btLabeled){   // first time: choose the output (this is also what lets the page read its name)
    try{
      const d=await md.selectAudioOutput(btPick?{deviceId:btPick.id}:undefined);
      btPick={id:d.deviceId,label:d.label};try{localStorage.setItem('chill_bt_pick',JSON.stringify(btPick));}catch(_){}
      await btScan();
    }catch(_){}   // cancelled or refused: the headphones still come out by hand
  }

}
async function btSync(){   // one at a time: attach and detach never overlap, whatever order the events come in
  if(btBusy||!PHYS)return;btBusy=true;
  try{
    await waitFor(()=>physOn,8000);
    while(btHave!==btOn){
      if(btOn){await btAttach();btHave=true;}
      else{await hpRetract();btHave=false;}
    }
  }finally{btBusy=false;}
}

function pkFrame(dt){

  if(!PK.ready)return;
  dt=Math.min(dt,.05);

   With ONE puppy out it plays alone: runs after the ball and either nudges it along the floor with its nose or scoops it up and keeps it in the air with its head (a few headers, then it sends it off again).
   With TWO puppies out they play catch: every hit is a lob to the other puppy, which walks under it, heads it back, and so on. They keep about BALL.S between them.
   After 14-23 seconds a puppy gets bored (25 s) and goes back to its normal things; dropping a new ball wakes them up.

/* where will the ball be when the puppy can reach it? hit = it will come down through the height of the lips; x = where */

  const now=performance.now();if(now<(dog.ballBored||0))return null;

   DESKTOP PET runtime (active only with ?pet=full|mini, see 01-core/02-pet-config.js)
   - frame limiter: capped fps, lower while idle, can be paused (music keeps playing)
   - click-through: asks the desktop shell to ignore the mouse over fully transparent pixels

/* ---------- frame scheduling (used by every mode; outside pet mode it is plain requestAnimationFrame) ---------- */

  if(PET.paused){PET.timer=setTimeout(nextFrame,300);return;}                  // paused: poll for resume, draw nothing
  const idle=performance.now()-PET.lastAct>PET.idleAfter,fps=idle?PET.idleFps:PET.fps,
        gap=1000/fps-(performance.now()-PET.lastRender);
  if(gap>8)PET.timer=setTimeout(()=>{PET.timer=0;requestAnimationFrame(frame);},gap-6);   // sleep instead of waking up every 16 ms
  else{PET.timer=0;requestAnimationFrame(frame);}
}
function petWake(){   // activity while a long sleep is pending: draw right away instead of waiting out the idle frame time
  if(PET.timer&&!PET.paused){clearTimeout(PET.timer);PET.timer=0;requestAnimationFrame(frame);}
}
